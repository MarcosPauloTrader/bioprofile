// ======================= SCORING =======================
function calcScores(resp){
  const dim={A:0,B:0,C:0,D:0,E:0,F:0}; const flags=[]; let total=0,cnt=0;
  QS.forEach(q=>{ const sel=resp&&resp[q.id]; if(!sel)return; cnt++;
    const o=q.opts.find(x=>x.l===sel); if(!o)return; dim[q.dim]+=o.s; total+=o.s;
    if(o.flag) flags.push({n:"Q"+q.id,flag:o.flag,ans:o.t}); });
  let weighted=0; Object.entries(DIMS).forEach(([k,v])=>{weighted+=(dim[k]/v.max)*v.w;});
  return {dim,flags,total,weighted:Math.round(weighted),cnt,maxTotal:72};
}

// ======================= CPF =======================
function formatCPF(v){ const d=(v||"").replace(/\D/g,"").slice(0,11); let o=d;
  if(d.length>9)o=d.slice(0,3)+"."+d.slice(3,6)+"."+d.slice(6,9)+"-"+d.slice(9);
  else if(d.length>6)o=d.slice(0,3)+"."+d.slice(3,6)+"."+d.slice(6);
  else if(d.length>3)o=d.slice(0,3)+"."+d.slice(3); return o; }
function isValidCPF(v){ const c=(v||"").replace(/\D/g,""); if(c.length!==11||/^(\d)\1{10}$/.test(c))return false;
  let s=0; for(let i=0;i<9;i++)s+=parseInt(c[i])*(10-i); let r=(s*10)%11; if(r===10)r=0; if(r!==parseInt(c[9]))return false;
  s=0; for(let i=0;i<10;i++)s+=parseInt(c[i])*(11-i); r=(s*10)%11; if(r===10)r=0; return r===parseInt(c[10]); }

// ======================= CV =======================
function toB64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(",")[1]); r.onerror=()=>rej(new Error("Falha ao ler arquivo")); r.readAsDataURL(file); }); }
async function readCV(file){
  const name=file.name, lower=name.toLowerCase(), mb=file.size/1024/1024;
  if(mb>4) throw new Error("Arquivo muito grande ("+mb.toFixed(1)+"MB). Máximo 4MB.");
  if(lower.endsWith(".pdf")) return {kind:"pdf",name,b64:await toB64(file),file};
  if(/\.(jpe?g|png)$/.test(lower)) return {kind:"image",name,mediaType:lower.endsWith(".png")?"image/png":"image/jpeg",b64:await toB64(file),file};
  if(lower.endsWith(".docx")){ const ab=await file.arrayBuffer(); const r=await window.mammoth.extractRawText({arrayBuffer:ab}); return {kind:"text",name,texto:r.value}; }
  if(lower.endsWith(".doc")) throw new Error("Arquivo .doc antigo não suportado. Salve como PDF ou .docx.");
  throw new Error("Formato não aceito. Envie PDF, DOCX, JPG ou PNG.");
}

// ======================= SUPABASE =======================
async function uploadToStorage(cpf,file){
  const safe=(file.name||"cv").replace(/[^a-zA-Z0-9._-]/g,"_");
  const url=SUPA_URL+"/functions/v1/put-cv?cpf="+encodeURIComponent(cpf.replace(/\D/g,""))+"&name="+encodeURIComponent(safe);
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":file.type||"application/octet-stream"},body:file});
  const d=await r.json().catch(()=>({}));
  if(!r.ok||!d.path){ throw new Error("Falha ao enviar currículo ("+r.status+(d.error?" "+d.error:"")+")"); }
  return d.path;
}
async function insertCandidato(payload){
  let r=await fetch(SUPA_URL+"/rest/v1/candidatos",{method:"POST",headers:{...H,Prefer:"return=minimal"},body:JSON.stringify(payload)});
  if(r.status===409){ // CPF já cadastrou antes — atualiza o registro dele
    r=await fetch(SUPA_URL+"/rest/v1/candidatos?cpf=eq."+encodeURIComponent(payload.cpf),{method:"PATCH",headers:{...H,Prefer:"return=minimal"},body:JSON.stringify(payload)});
  }
  if(!r.ok){ const t=await r.text(); throw new Error("Falha ao salvar ("+r.status+"): "+t); }
}
async function rh(action,extra){
  const r=await fetch(SUPA_URL+"/functions/v1/rh-api",{method:"POST",headers:H,body:JSON.stringify({action,...extra})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error==="SENHA_INVALIDA"?"Senha do RH incorreta.":(d.msg||d.error||"Erro "+r.status));
  return d;
}

async function gerarLaudo({cand, av, scores, cvBlock}){
  const dimTxt=Object.entries(DIMS).map(([k,v])=>"  "+v.name+": "+scores.dim[k]+"/"+v.max+" ("+Math.round(scores.dim[k]/v.max*100)+"%) [peso "+v.w+"%]").join("\n");
  const flagsTxt=scores.flags.length?scores.flags.map(f=>"  ⚑ "+f.flag+" — "+f.n+': "'+f.ans+'"').join("\n"):"  nenhum";
  const falaTxt=(av&&(av.fala_persuasao!=null||av.fala_analise))
    ? "Persuasão/energia: "+(av.fala_persuasao??"-")+"/10 · Consistência c/ teste: "+(av.fala_consistencia??"-")+"/10 · Clareza/articulação: "+(av.fala_clareza??"-")+"/10\nAnálise do vídeo: "+(av.fala_analise||"-")
    : "(Análise de fala não fornecida)";
  const cvTxt = cand.cv_texto ? cand.cv_texto : (cand.tem_cv ? "(anexado como arquivo — analise o documento/imagem em anexo)" : "(não enviado)");
  const prompt =
"Você é Dra. Sofia Mendes, psicóloga organizacional sênior avaliando vendedores de varejo no Brasil. Linguagem direta, ancorada nos dados.\n\n"+
"CANDIDATO: "+cand.nome+" · CPF "+(cand.cpf||"")+" · Vendedor (Bio Celulares) · "+new Date().toLocaleDateString("pt-BR")+"\n\n"+
"TESTE — Score ponderado "+scores.weighted+"/100 · "+scores.cnt+"/18 respondidas\n"+dimTxt+"\nRed flags:\n"+flagsTxt+"\n\n"+
"PROCESSOS (JusBrasil): "+((av&&av.jusbrasil_qtd&&av.jusbrasil_qtd!=="0")?(av.jusbrasil_qtd+" processo(s). "+(av.jusbrasil_obs||"")+" — 1 pode ser legítimo; 2 atenção; 3+ relação litigiosa recorrente."):"nenhum informado")+"\n\n"+
"QUESTÕES ABERTAS:\nG1: \""+((cand.abertas&&cand.abertas["19"])||"-")+"\"\nG2: \""+((cand.abertas&&cand.abertas["20"])||"-")+"\"\n\n"+
"ENTREVISTA (resumo RH/Gemini): "+((av&&av.resumo_entrevista)||"(não fornecido)")+"\n\n"+
"ANÁLISE DE FALA/VÍDEO DA ENTREVISTA:\n"+falaTxt+"\n\n"+
"CURRÍCULO: "+cvTxt+"\n\n"+
"Gere o laudo integrando TUDO (teste + abertas + currículo + processos + entrevista + fala). A análise de fala pesa no potencial comercial. Retorne SOMENTE JSON válido, sem markdown:\n"+
'{"resumoExecutivo":"","perfilComportamental":"","analiseFala":"análise da comunicação/persuasão/clareza ou N/A","pontosFortes":["",""],"pontosAtencao":["",""],"riscoCarater":"BAIXO|MÉDIO|ALTO|CRÍTICO","riscoCaraterJustificativa":"","potencialVendas":"BAIXO|MÉDIO|ALTO|EXCEPCIONAL","potencialVendasJustificativa":"","impactoProcessos":"ou N/A","recomendacao":"CONTRATAR|CONTRATAR COM RESSALVAS|NÃO CONTRATAR","recomendacaoJustificativa":"","condicoes":"ou N/A","perguntasAprofundamento":["","",""],"scoreGeral":0}';
  const content=[{type:"text",text:prompt}];
  if(cvBlock) content.push(cvBlock);
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:4096,messages:[{role:"user",content}]})});
  if(!res.ok){ const e=await res.text(); throw new Error("Falha na IA ("+res.status+"). "+e.slice(0,160)); }
  const data=await res.json();
  if(data.stop_reason==="max_tokens") throw new Error("Resposta cortada por tamanho. Tente novamente.");
  let txt=(data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("").replace(/```json|```/g,"").trim();
  const a=txt.indexOf("{"), b=txt.lastIndexOf("}"); if(a!==-1&&b!==-1)txt=txt.slice(a,b+1);
  let laudo; try{ laudo=JSON.parse(txt); }catch(e){ throw new Error("A IA retornou formato inesperado. Tente de novo."); }
  laudo.scores={dim:scores.dim,weighted:scores.weighted,cnt:scores.cnt,flags:scores.flags};
  laudo.candidateName=cand.nome; laudo.cpf=cand.cpf; laudo.litCount=(av&&av.jusbrasil_qtd)||"0"; laudo.generatedAt=new Date().toISOString();
  return laudo;
}

      style={{position:"absolute",width:1,height:1,opacity:0,overflow:"hidden",pointerEvents:"none"}}/>
    <button type="button" onClick={()=>ref.current&&ref.current.click()} style={style}>{loading?"Lendo arquivo...":children}</button>
  </React.Fragment>);
}

// ======================= CANDIDATO =======================
function Candidato(){
  const [step,setStep]=useState(0);
  const [name,setName]=useState(""); const [cpf,setCpf]=useState(""); const [consent,setConsent]=useState(false);
  const [answers,setAnswers]=useState({}); const [openA,setOpenA]=useState({19:"",20:""});
  const [cv,setCv]=useState(null); const [cvErr,setCvErr]=useState(""); const [cvLoading,setCvLoading]=useState(false); const [noCv,setNoCv]=useState(false);
  const [saving,setSaving]=useState(false); const [done,setDone]=useState(false); const [saveErr,setSaveErr]=useState("");
  const answered=QS.filter(q=>answers[q.id]).length; const allAns=answered===18;
  const openOk=(openA[19]||"").trim().length>=15 && (openA[20]||"").trim().length>=15;
  const wrap={maxWidth:680,margin:"0 auto",padding:"16px 16px 48px"};
  const primary=(ok)=>({width:"100%",padding:16,background:!ok?"var(--line)":"linear-gradient(135deg,#1D4ED8,#7C3AED)",color:!ok?"var(--muted)":"#fff",border:"none",borderRadius:12,fontSize:16,fontWeight:800,cursor:!ok?"not-allowed":"pointer"});

  const handleCv=async(e)=>{ const f=e.target.files&&e.target.files[0]; if(!f)return; setCvErr("");setCvLoading(true);setNoCv(false);
    try{ setCv(await readCV(f)); }catch(err){ setCvErr(err.message); setCv(null);} finally{ setCvLoading(false);} };

  const submit=async()=>{
    setSaving(true); setSaveErr("");
    const key=cpf.replace(/\D/g,"");
    try{
      const payload={cpf:key,nome:name.trim(),respostas:answers,abertas:openA,consentimento:true,tem_cv:!!cv,atualizado_em:new Date().toISOString()};
      if(cv){ payload.cv_nome=cv.name; payload.cv_tipo=cv.kind;
        if(cv.kind==="text"){ payload.cv_texto=cv.texto; }
        else { payload.cv_path=await uploadToStorage(key,cv.file); }
      }
      await insertCandidato(payload);
      setDone(true); setStep(5);
    }catch(err){ setSaveErr(err.message); } finally{ setSaving(false); }
  };

  if(step===0) return (<div style={wrap}>
    <div style={{background:"linear-gradient(135deg,#0F172A,#1e3a8a,#4c1d95)",borderRadius:18,padding:"30px 26px",color:"#fff",marginBottom:22}}>
      <div style={{fontSize:11,opacity:.6,letterSpacing:2,textTransform:"uppercase",marginBottom:8}}>Bio Celulares · Seleção</div>
      <div style={{fontSize:25,fontWeight:900,marginBottom:10,lineHeight:1.2}}>Avaliação para Vendedor</div>
      <div style={{fontSize:14,opacity:.85,lineHeight:1.7}}>São 18 perguntas rápidas e 2 para escrever. Não há certo ou errado — queremos te conhecer. Leva ~15 minutos.</div>
    </div>
    <label style={{fontSize:13,fontWeight:700,display:"block",marginBottom:6}}>Seu nome completo</label>
    <input value={name} onChange={e=>setName(e.target.value)} placeholder="Digite seu nome" style={{width:"100%",padding:"14px 16px",border:"2px solid var(--line)",borderRadius:11,fontSize:15,background:"var(--card)",color:"var(--ink)",marginBottom:16}}/>
    <label style={{fontSize:13,fontWeight:700,display:"block",marginBottom:6}}>CPF</label>
    <input value={cpf} onChange={e=>setCpf(formatCPF(e.target.value))} inputMode="numeric" placeholder="000.000.000-00" style={{width:"100%",padding:"14px 16px",border:"2px solid "+(cpf.length===14?(isValidCPF(cpf)?"#6EE7B7":"#FCA5A5"):"var(--line)"),borderRadius:11,fontSize:15,background:"var(--card)",color:"var(--ink)",marginBottom:cpf.length===14&&!isValidCPF(cpf)?4:16}}/>
    {cpf.length===14&&!isValidCPF(cpf)&&<div style={{fontSize:12,color:"#DC2626",fontWeight:600,marginBottom:14}}>CPF inválido — confira os números.</div>}
    <label style={{display:"flex",gap:10,alignItems:"flex-start",cursor:"pointer",background:"var(--card)",border:"1px solid var(--line)",borderRadius:10,padding:"12px 14px",marginBottom:18}}>
      <input type="checkbox" checked={consent} onChange={e=>setConsent(e.target.checked)} style={{width:18,height:18,marginTop:1,flexShrink:0}}/>
      <span style={{fontSize:12.5,color:"var(--muted)",lineHeight:1.5}}>Autorizo o uso dos meus dados (nome, CPF, respostas e currículo) exclusivamente para este processo seletivo da Bio Celulares, conforme a LGPD.</span>
    </label>
    {(()=>{const ok=name.trim().length>=2&&isValidCPF(cpf)&&consent; return <button onClick={()=>setStep(1)} disabled={!ok} style={primary(ok)}>Começar →</button>;})()}
  </div>);

  if(step===1) return (<div style={wrap}>
    <div style={{position:"sticky",top:0,background:"var(--bg)",paddingTop:4,paddingBottom:12,zIndex:10,marginBottom:8}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span style={{fontSize:13,fontWeight:700}}>Parte 1 de 3 · Múltipla escolha</span><span style={{fontSize:13,fontWeight:800,color:allAns?"#059669":"#1D4ED8"}}>{answered}/18</span></div>
      <Bar value={answered} max={18} color={allAns?"#059669":"#1D4ED8"} h={8}/>
    </div>
    {QS.map((q,i)=>{ const sel=answers[q.id]; return (<div key={q.id} style={{background:"var(--card)",border:"2px solid "+(sel?"#C7D2FE":"var(--line)"),borderRadius:14,padding:18,marginBottom:14}}>
      <div style={{display:"flex",gap:10,marginBottom:14}}><span style={{background:"#EEF2FF",color:"#4338CA",borderRadius:7,padding:"3px 10px",fontSize:12,fontWeight:800,height:"fit-content"}}>{i+1}</span><p style={{margin:0,fontSize:15,lineHeight:1.55,fontWeight:500}}>{q.q}</p></div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>{q.opts.map(opt=>{ const on=sel===opt.l; return (
        <button key={opt.l} onClick={()=>setAnswers(p=>({...p,[q.id]:opt.l}))} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",background:on?"#EEF2FF":"var(--bg)",border:"2px solid "+(on?"#6366F1":"var(--line)"),borderRadius:10,cursor:"pointer",textAlign:"left"}}>
          <span style={{width:22,height:22,borderRadius:"50%",flexShrink:0,background:on?"#6366F1":"var(--card)",border:"2px solid "+(on?"#6366F1":"#cbd5e1"),display:"flex",alignItems:"center",justifyContent:"center"}}>{on&&<span style={{width:9,height:9,borderRadius:"50%",background:"#fff"}}/>}</span>
          <span style={{fontSize:14,color:on?"#1e293b":"var(--ink)",lineHeight:1.45}}>{opt.t}</span>
        </button>);})}</div>
    </div>);})}
    <button onClick={()=>setStep(2)} disabled={!allAns} style={primary(allAns)}>{allAns?"Continuar →":"Responda todas ("+(18-answered)+" restantes)"}</button>
  </div>);

  if(step===2) return (<div style={wrap}>
    <div style={{marginBottom:18}}><span style={{fontSize:13,fontWeight:700}}>Parte 2 de 3 · Para escrever</span></div>
    {OPEN_QS.map(q=>(<div key={q.id} style={{background:"var(--card)",border:"2px solid var(--line)",borderRadius:14,padding:18,marginBottom:16}}>
      <p style={{margin:"0 0 12px",fontSize:15,lineHeight:1.55,fontWeight:500}}>{q.q}</p>
      <textarea value={openA[q.id]} onChange={e=>setOpenA(p=>({...p,[q.id]:e.target.value}))} placeholder="Escreva sua resposta aqui..." rows={5} style={{width:"100%",padding:"12px 14px",border:"2px solid var(--line)",borderRadius:10,fontSize:14,background:"var(--bg)",color:"var(--ink)",resize:"vertical",lineHeight:1.6}}/>
      <div style={{fontSize:11,textAlign:"right",marginTop:4,color:(openA[q.id]||"").trim().length>=15?"#059669":"var(--muted)"}}>{(openA[q.id]||"").trim().length>=15?"✓ ok":"escreva um pouco mais"}</div>
    </div>))}
    <div style={{display:"flex",gap:10}}><button onClick={()=>setStep(1)} style={{flex:"0 0 auto",padding:"16px 20px",background:"var(--card)",color:"var(--muted)",border:"2px solid var(--line)",borderRadius:12,fontSize:15,fontWeight:700,cursor:"pointer"}}>← Voltar</button><button onClick={()=>setStep(3)} disabled={!openOk} style={primary(openOk)}>Continuar →</button></div>
  </div>);

  if(step===3){ const ready=cv||noCv; return (<div style={wrap}>
    <div style={{marginBottom:18}}><span style={{fontSize:13,fontWeight:700}}>Parte 3 de 3 · Seu currículo</span></div>
    <div style={{background:"var(--card)",border:"2px solid var(--line)",borderRadius:14,padding:22,marginBottom:16}}>
      <p style={{margin:"0 0 16px",fontSize:15,lineHeight:1.6}}>Envie seu currículo — pode ser <b>PDF, Word (.docx) ou foto (JPG/PNG)</b>.</p>
      <CVButton onFile={handleCv} loading={cvLoading} style={{display:"block",width:"100%",border:"2px dashed "+(cv?"#6EE7B7":"#C7D2FE"),borderRadius:12,padding:"26px 20px",textAlign:"center",cursor:"pointer",background:cv?"rgba(16,185,129,.08)":"rgba(99,102,241,.06)"}}>
        {cv?<span style={{fontSize:14,color:"#15803D",fontWeight:700}}>✓ {cv.name}<br/><span style={{fontSize:12,fontWeight:400}}>toque para trocar</span></span>:<span style={{fontSize:14,color:"#4338CA",fontWeight:600}}>📎 Toque para escolher o arquivo</span>}
      </CVButton>
      {cvErr&&<div style={{marginTop:12,background:"#FFF1F2",border:"1px solid #FECDD3",borderRadius:8,padding:"10px 14px",fontSize:13,color:"#BE123C"}}>{cvErr}</div>}
      <label style={{display:"flex",alignItems:"center",gap:8,marginTop:16,cursor:"pointer"}}><input type="checkbox" checked={noCv} onChange={e=>{setNoCv(e.target.checked);if(e.target.checked){setCv(null);setCvErr("");}}} style={{width:16,height:16}}/><span style={{fontSize:13,color:"var(--muted)"}}>Não tenho currículo em arquivo</span></label>
    </div>
    {saveErr&&<div style={{background:"#FFF1F2",border:"2px solid #FECDD3",borderRadius:10,padding:"12px 16px",marginBottom:14,fontSize:13,color:"#BE123C",fontWeight:600}}>{saveErr}</div>}
    <div style={{display:"flex",gap:10}}><button onClick={()=>setStep(2)} style={{flex:"0 0 auto",padding:"16px 20px",background:"var(--card)",color:"var(--muted)",border:"2px solid var(--line)",borderRadius:12,fontSize:15,fontWeight:700,cursor:"pointer"}}>← Voltar</button>
      <button onClick={submit} disabled={!ready||saving} style={{...primary(ready&&!saving),background:(!ready||saving)?"var(--line)":"linear-gradient(135deg,#059669,#047857)"}}>{saving?"Enviando...":"Enviar respostas ✓"}</button></div>
  </div>);}

  return (<div style={wrap}>
    <div style={{background:"linear-gradient(135deg,#059669,#047857)",borderRadius:18,padding:"40px 28px",color:"#fff",textAlign:"center",marginBottom:20}}>
      <div style={{fontSize:52,marginBottom:10}}>✓</div><div style={{fontSize:26,fontWeight:900,marginBottom:10}}>Respostas enviadas!</div>
      <div style={{fontSize:15,opacity:.92,lineHeight:1.6}}>Obrigado, {name.split(" ")[0]}. Recebemos suas respostas e seu currículo. A equipe de seleção vai analisar e entrar em contato. Você já pode fechar esta página.</div>
    </div>
    <div style={{background:"var(--card)",border:"2px solid var(--line)",borderRadius:14,padding:"18px 20px",textAlign:"center",fontSize:13,color:"var(--muted)"}}>Registrado em nome de <b style={{color:"var(--ink)"}}>{name}</b>.</div>
  </div>);
}

// ======================= RECRUTADOR =======================
function Recrutador({onExit}){
  const [pin,setPin]=useState(""); const [authed,setAuthed]=useState(false); const [pinErr,setPinErr]=useState("");
  const [list,setList]=useState([]); const [search,setSearch]=useState(""); const [loadingList,setLoadingList]=useState(false);
  const [sel,setSel]=useState(null); const [loadErr,setLoadErr]=useState(""); const [showInt,setShowInt]=useState(false);
  const [gemini,setGemini]=useState(""); const [jqtd,setJqtd]=useState("0"); const [jobs,setJobs]=useState("");
  const [fp,setFp]=useState(""); const [fc,setFc]=useState(""); const [fcl,setFcl]=useState(""); const [fan,setFan]=useState("");
  const [rhCv,setRhCv]=useState(null); const [rhCvErr,setRhCvErr]=useState(""); const [rhCvLoading,setRhCvLoading]=useState(false);
  const [report,setReport]=useState(null); const [gen,setGen]=useState(false); const [genErr,setGenErr]=useState(""); const [existing,setExisting]=useState(null);
  const wrap={maxWidth:760,margin:"0 auto",padding:"16px 16px 48px"};

  const doLogin=async()=>{ setPinErr("");
    try{ const d=await rh("list",{senha:pin}); setAuthed(true); setList(d.list||[]); }
    catch(e){ setPinErr(e.message); } };
  const refreshList=async()=>{ setLoadingList(true); try{ const d=await rh("list",{senha:pin}); setList(d.list||[]);}catch(e){} finally{setLoadingList(false);} };

  const openCand=async(cpf)=>{ setLoadErr(""); setReport(null); setExisting(null); setRhCv(null);
    try{ const d=await rh("detail",{senha:pin,cpf}); const scores=calcScores(d.candidato.respostas||{});
      setSel({...d,scores});
      const av=d.avaliacao||{};
      setGemini(av.resumo_entrevista||""); setJqtd(av.jusbrasil_qtd||"0"); setJobs(av.jusbrasil_obs||"");
      setFp(av.fala_persuasao!=null?String(av.fala_persuasao):""); setFc(av.fala_consistencia!=null?String(av.fala_consistencia):"");
      setFcl(av.fala_clareza!=null?String(av.fala_clareza):""); setFan(av.fala_analise||"");
      if(d.laudo) setExisting(d.laudo);
    }catch(e){ setLoadErr(e.message); } };

  const handleRhCv=async(e)=>{ const f=e.target.files&&e.target.files[0]; if(!f)return; setRhCvErr(""); setRhCvLoading(true);
    try{ const r=await readCV(f); setRhCv(r);
      const cpf=sel.candidato.cpf;
      if(r.kind==="text"){ await rh("cv_text",{senha:pin,cpf,cv_texto:r.texto,cv_nome:r.name,cv_tipo:"text",cv_path:null}); }
      else { const path=await uploadToStorage(cpf,r.file); await rh("cv_text",{senha:pin,cpf,cv_texto:null,cv_nome:r.name,cv_tipo:r.kind,cv_path:path}); }
      await openCand(cpf);
    }catch(err){ setRhCvErr(err.message); } finally{ setRhCvLoading(false);} };

  const saveAval=async()=>{ await rh("save_avaliacao",{senha:pin,cpf:sel.candidato.cpf,resumo_entrevista:gemini,jusbrasil_qtd:jqtd,jusbrasil_obs:jobs,fala_persuasao:fp===""?null:parseInt(fp),fala_consistencia:fc===""?null:parseInt(fc),fala_clareza:fcl===""?null:parseInt(fcl),fala_analise:fan}); };

  const generate=async()=>{ setGen(true); setGenErr("");
    try{
      await saveAval();
      const r=await fetch(SUPA_URL+"/functions/v1/generate-report",{method:"POST",headers:H,body:JSON.stringify({cpf:sel.candidato.cpf,senha:pin})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok){
        if(d.error==="SEM_CHAVE_IA") throw new Error("Falta configurar a chave de IA (ANTHROPIC_API_KEY) no servidor Supabase para gerar laudos automaticamente.");
        throw new Error(d.msg||d.error||"Erro "+r.status);
      }
      setReport(d.laudo); setExisting(d.laudo);
    }catch(e){ setGenErr(e.message); } finally{ setGen(false); } };

  // ---- PIN screen ----
  if(!authed) return (<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
    <div style={{maxWidth:380,width:"100%"}}>
      <div style={{background:"linear-gradient(135deg,#0F172A,#1e3a8a)",borderRadius:18,padding:"30px 26px",color:"#fff",marginBottom:18,textAlign:"center"}}>
        <div style={{fontSize:34,marginBottom:8}}>🔐</div><div style={{fontSize:20,fontWeight:900,marginBottom:6}}>Área restrita do RH</div>
        <div style={{fontSize:13,opacity:.8,lineHeight:1.6}}>Digite a senha do RH. Candidatos não têm acesso a esta área.</div>
      </div>
      <input type="password" value={pin} onChange={e=>{setPin(e.target.value);setPinErr("");}} onKeyDown={e=>{if(e.key==="Enter")doLogin();}} placeholder="Senha do RH" autoFocus
        style={{width:"100%",padding:"14px 16px",border:"2px solid "+(pinErr?"#FCA5A5":"var(--line)"),borderRadius:11,fontSize:16,background:"var(--card)",color:"var(--ink)",marginBottom:pinErr?6:14}}/>
      {pinErr&&<div style={{fontSize:13,color:"#DC2626",fontWeight:600,marginBottom:14,textAlign:"center"}}>{pinErr}</div>}
      <button onClick={doLogin} disabled={!pin} style={{width:"100%",padding:15,background:!pin?"var(--line)":"linear-gradient(135deg,#1D4ED8,#7C3AED)",color:!pin?"var(--muted)":"#fff",border:"none",borderRadius:12,fontSize:16,fontWeight:800,cursor:!pin?"not-allowed":"pointer",marginBottom:10}}>Entrar</button>
      <button onClick={onExit} style={{width:"100%",padding:12,background:"none",border:"none",color:"var(--muted)",fontSize:13,cursor:"pointer"}}>← Voltar</button>
    </div>
  </div>);

  // ---- Report ----
  if(report) return <div style={wrap}><Laudo report={report} onBack={()=>setReport(null)}/></div>;

  // ---- List ----
  if(!sel){ const q=search.trim().toLowerCase(); const qd=search.replace(/\D/g,"");
    const filtered=q?list.filter(c=>(c.nome||"").toLowerCase().includes(q)||(qd&&(c.cpf||"").replace(/\D/g,"").includes(qd))):list;
    return (<div style={wrap}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <span style={{fontSize:13,fontWeight:800}}>BioProfile · Recrutador</span>
        <span><button onClick={refreshList} style={{background:"none",border:"none",color:"#1D4ED8",fontSize:12,cursor:"pointer",fontWeight:700}}>{loadingList?"...":"↻ atualizar"}</button> <button onClick={onExit} style={{background:"none",border:"none",color:"var(--muted)",fontSize:12,cursor:"pointer"}}>sair</button></span>
      </div>
      <div style={{background:"var(--card)",border:"2px solid var(--line)",borderRadius:14,padding:22,marginBottom:16}}>
        <div style={{fontSize:15,fontWeight:800,marginBottom:4}}>Candidatos</div>
        <div style={{fontSize:13,color:"var(--muted)",marginBottom:16}}>Busque por nome ou CPF e toque para abrir.</div>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Buscar por nome ou CPF" style={{width:"100%",padding:"13px 16px",border:"2px solid var(--line)",borderRadius:11,fontSize:15,background:"var(--bg)",color:"var(--ink)"}}/>
      </div>
      <div style={{background:"var(--card)",border:"2px solid var(--line)",borderRadius:14,padding:18}}>
        <div style={{fontSize:12,fontWeight:700,color:"var(--muted)",textTransform:"uppercase",letterSpacing:.5,marginBottom:12}}>{q?"Resultados ("+filtered.length+")":"Registrados ("+list.length+")"}</div>
        {loadErr&&<div style={{background:"#FFF1F2",border:"1px solid #FECDD3",borderRadius:8,padding:"10px 14px",fontSize:13,color:"#BE123C",marginBottom:10}}>{loadErr}</div>}
        {filtered.length===0?<div style={{fontSize:13,color:"var(--muted)",textAlign:"center",padding:"16px 0"}}>{list.length===0?"Nenhum candidato ainda. Compartilhe o link com os candidatos.":"Nenhum encontrado."}</div>
          :filtered.map(c=>(<button key={c.cpf} onClick={()=>openCand(c.cpf)} style={{width:"100%",display:"flex",justifyContent:"space-between",alignItems:"center",padding:"13px 14px",background:"var(--bg)",border:"1px solid var(--line)",borderRadius:10,marginBottom:8,cursor:"pointer",textAlign:"left"}}>
            <div><div style={{fontSize:14,fontWeight:700}}>{c.nome}</div><div style={{fontSize:11,color:"var(--muted)"}}>{formatCPF(c.cpf)} · {new Date(c.criado_em).toLocaleString("pt-BR")}</div>{c.hasReport&&<div style={{fontSize:10,fontWeight:700,color:"#059669",marginTop:3}}>✅ Laudo pronto{c.recomendacao?" · "+c.recomendacao:""}</div>}</div>
            <span style={{fontSize:18,color:"var(--muted)"}}>›</span>
          </button>))}
      </div>
      <div style={{background:"rgba(59,130,246,.08)",border:"2px solid #BFDBFE",borderRadius:14,overflow:"hidden",marginTop:16}}>
        <button onClick={()=>setShowInt(!showInt)} style={{width:"100%",padding:"14px 18px",background:"transparent",border:"none",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:14,fontWeight:800,color:"#1E40AF"}}>🎤 Roteiro de Entrevista (10 perguntas)</span><span style={{color:"#1E40AF"}}>{showInt?"▲":"▼"}</span></button>
        {showInt&&<div style={{padding:"0 16px 16px"}}>{INT_QS.map((qq,i)=>(<div key={i} style={{background:"var(--card)",borderRadius:10,padding:"12px 14px",marginBottom:8}}><div style={{fontSize:10,color:"var(--muted)",fontWeight:700,textTransform:"uppercase",letterSpacing:.5,marginBottom:3}}>{qq.icon} {qq.area} · cruzar com {qq.cross}</div><div style={{fontSize:13,fontWeight:600,marginBottom:6,lineHeight:1.45}}>{qq.q}</div><div style={{fontSize:12,color:"var(--muted)",lineHeight:1.5}}>👁 {qq.tip}</div></div>))}</div>}
      </div>
    </div>);
  }

  // ---- Evaluation ----
  const sc=sel.scores; const cand=sel.candidato; const ecv=rhCv||((cand.tem_cv)?{name:cand.cv_nome,kind:cand.cv_tipo}:null);
  const crit=sc.flags.filter(f=>f.flag.includes("🚨")); const warn=sc.flags.filter(f=>f.flag.includes("⚠️"));
  return (<div style={wrap}>
    <button onClick={()=>{setSel(null);refreshList();}} style={{background:"none",border:"none",color:"var(--muted)",fontSize:13,cursor:"pointer",marginBottom:12,padding:0}}>← Voltar à lista</button>
    <div style={{background:"linear-gradient(135deg,#0F172A,#1e3a8a)",borderRadius:14,padding:"18px 22px",color:"#fff",marginBottom:18}}>
      <div style={{fontSize:10,opacity:.6,letterSpacing:1,textTransform:"uppercase"}}>Candidato</div>
      <div style={{fontSize:20,fontWeight:900}}>{cand.nome}</div>
      <div style={{fontSize:12,opacity:.85,fontFamily:"monospace"}}>CPF: {formatCPF(cand.cpf)}</div>
      <div style={{fontSize:12,opacity:.7,marginTop:2}}>Enviado em {new Date(cand.criado_em).toLocaleString("pt-BR")}</div>
    </div>
    {existing&&!report&&<div style={{background:"rgba(16,185,129,.1)",border:"2px solid #6EE7B7",borderRadius:12,padding:16,marginBottom:16}}>

      {crit.length>0&&<div style={{background:"#FFF1F2",border:"1px solid #FECDD3",borderRadius:8,padding:"10px 12px",marginTop:12}}><div style={{fontSize:11,fontWeight:800,color:"#BE123C",marginBottom:4}}>🚨 RED FLAGS CRÍTICOS</div>{crit.map((f,i)=><div key={i} style={{fontSize:12,color:"#9F1239"}}>• {f.n}: {f.flag}</div>)}</div>}
      {warn.length>0&&<div style={{background:"#FFF7ED",border:"1px solid #FED7AA",borderRadius:8,padding:"8px 12px",marginTop:8}}><div style={{fontSize:11,fontWeight:800,color:"#C2410C",marginBottom:4}}>⚠️ ALERTAS</div>{warn.map((f,i)=><div key={i} style={{fontSize:12,color:"#9A3412"}}>• {f.n}: {f.flag}</div>)}</div>}
    </div>
    <div style={{background:"rgba(124,58,237,.06)",border:"2px solid #DDD6FE",borderRadius:14,padding:18,marginBottom:16}}>
      <div style={{fontSize:11,fontWeight:700,color:"#5B21B6",marginBottom:12,textTransform:"uppercase",letterSpacing:.5}}>✍️ Respostas abertas</div>
      {OPEN_QS.map(q=>(<div key={q.id} style={{background:"var(--card)",borderRadius:9,padding:"12px 14px",marginBottom:10,borderLeft:"4px solid #7C3AED"}}><div style={{fontSize:11,color:"#7C3AED",fontWeight:700,marginBottom:5}}>{q.n}</div><div style={{fontSize:13,lineHeight:1.6,whiteSpace:"pre-wrap"}}>{(cand.abertas&&cand.abertas[q.id])||"(em branco)"}</div></div>))}
    </div>
    <div style={{background:"var(--card)",border:"2px solid var(--line)",borderRadius:14,padding:18,marginBottom:16}}>
      <div style={{fontSize:11,fontWeight:700,marginBottom:10,textTransform:"uppercase",letterSpacing:.5}}>📄 Currículo</div>
      {ecv?<div style={{fontSize:13,fontWeight:600,marginBottom:8}}>✓ {ecv.name} <span style={{fontSize:11,color:"var(--muted)",fontWeight:400}}>({ecv.kind==="text"?"Word":ecv.kind==="pdf"?"PDF":"imagem"}{rhCv?" · anexado pelo RH":""})</span>{sel.cv_url&&<div style={{marginTop:6}}><a href={sel.cv_url} target="_blank" rel="noreferrer" style={{fontSize:12,color:"#1D4ED8"}}>abrir arquivo ↗</a></div>}</div>:<div style={{fontSize:13,color:"var(--muted)",marginBottom:4}}>Candidato não enviou currículo.</div>}
      <CVButton onFile={handleRhCv} loading={rhCvLoading} style={{display:"inline-block",marginTop:12,padding:"10px 16px",background:"#EEF2FF",color:"#4338CA",border:"2px dashed #C7D2FE",borderRadius:9,fontSize:13,fontWeight:700,cursor:"pointer"}}>{ecv?"📎 Substituir currículo":"📎 Importar currículo (RH)"}</CVButton>
      <div style={{fontSize:11,color:"var(--muted)",marginTop:6}}>Use quando o candidato não conseguiu enviar. PDF, DOCX, JPG ou PNG.</div>
      {rhCvErr&&<div style={{marginTop:8,background:"#FFF1F2",border:"1px solid #FECDD3",borderRadius:8,padding:"8px 12px",fontSize:12,color:"#BE123C"}}>{rhCvErr}</div>}
    </div>
    <div style={{background:(jqtd!=="0")?"#FFF7ED":"var(--card)",border:"2px solid "+(jqtd!=="0"?"#FED7AA":"var(--line)"),borderRadius:14,padding:18,marginBottom:16}}>
      <div style={{fontSize:14,fontWeight:700,color:jqtd!=="0"?"#92400E":"var(--ink)",marginBottom:4}}>⚖️ Processos contra empregadores (JusBrasil)</div>
      <div style={{fontSize:11,color:"var(--muted)",marginBottom:12}}>Consulte o nome no JusBrasil e registre quantos encontrou.</div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{[["0","Nenhum"],["1","1"],["2","2"],["3","3"],["3+","Mais de 3"]].map(([v,l])=>{const on=jqtd===v;const dg=v==="3"||v==="3+";const ac=on?(v==="0"?"#059669":dg?"#DC2626":"#D97706"):"var(--line)";return <button key={v} onClick={()=>setJqtd(v)} style={{flex:"1 1 auto",minWidth:58,padding:"10px 8px",background:on?ac:"var(--card)",color:on?"#fff":"var(--muted)",border:"2px solid "+ac,borderRadius:9,fontSize:13,fontWeight:on?800:600,cursor:"pointer"}}>{l}</button>;})}</div>
      {jqtd!=="0"&&<textarea value={jobs} onChange={e=>setJobs(e.target.value)} placeholder="Opcional: contexto (tipo de pedido, recorrência...)" rows={2} style={{width:"100%",marginTop:12,padding:"10px 14px",border:"2px solid #FED7AA",borderRadius:8,fontSize:13,background:"var(--card)",color:"var(--ink)",resize:"vertical"}}/>}
      {(jqtd==="3"||jqtd==="3+")&&<div style={{marginTop:10,background:"#FFF1F2",border:"1px solid #FECDD3",borderRadius:8,padding:"8px 12px",fontSize:12,color:"#BE123C",fontWeight:600}}>🚨 Volume alto de litígios — forte indicador de relação conflituosa recorrente.</div>}
    </div>
    <div style={{background:"rgba(37,99,235,.05)",border:"2px solid #BFDBFE",borderRadius:14,padding:18,marginBottom:16}}>
      <div style={{fontSize:14,fontWeight:700,color:"#1E40AF",marginBottom:4}}>🎥 Análise da fala (vídeo da entrevista)</div>
      <div style={{fontSize:11,color:"var(--muted)",marginBottom:12}}>Notas de 0 a 10 a partir do vídeo da entrevista. Pesa no potencial comercial do laudo.</div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:12}}>
        {[["Persuasão/energia",fp,setFp],["Consistência c/ teste",fc,setFc],["Clareza/articulação",fcl,setFcl]].map(([lab,val,setter],i)=>(
          <div key={i} style={{flex:"1 1 150px"}}><label style={{fontSize:11,fontWeight:700,color:"var(--muted)",display:"block",marginBottom:4}}>{lab}</label>
          <input value={val} onChange={e=>{const n=e.target.value.replace(/\D/g,"").slice(0,2);if(n===""||parseInt(n)<=10)setter(n);}} inputMode="numeric" placeholder="0-10" style={{width:"100%",padding:"10px 12px",border:"2px solid var(--line)",borderRadius:8,fontSize:14,background:"var(--card)",color:"var(--ink)"}}/></div>))}
      </div>
      <textarea value={fan} onChange={e=>setFan(e.target.value)} placeholder="Descreva a fala: fluência, vícios de linguagem, energia, se o que falou bate com o que respondeu no teste..." rows={4} style={{width:"100%",padding:"10px 14px",border:"2px solid var(--line)",borderRadius:8,fontSize:13,background:"var(--card)",color:"var(--ink)",resize:"vertical",lineHeight:1.6}}/>
    </div>
    <div style={{marginBottom:20}}>
      <label style={{fontSize:11,fontWeight:700,display:"block",marginBottom:6,textTransform:"uppercase",letterSpacing:.5}}>🎤 Resumo da Entrevista (Gemini)</label>
      <textarea value={gemini} onChange={e=>setGemini(e.target.value)} placeholder="Cole aqui o resumo da entrevista: impressões, respostas ao roteiro, comportamentos observados, inconsistências..." rows={6} style={{width:"100%",padding:"12px 14px",border:"2px solid var(--line)",borderRadius:11,fontSize:13,background:"var(--card)",color:"var(--ink)",resize:"vertical",lineHeight:1.6}}/>
    </div>
    {genErr&&<div style={{background:"#FFF1F2",border:"2px solid #FECDD3",borderRadius:10,padding:"12px 16px",marginBottom:14,fontSize:13,color:"#BE123C",fontWeight:600}}>❌ {genErr}</div>}
    <button onClick={generate} disabled={gen} style={{width:"100%",padding:17,background:gen?"var(--line)":"linear-gradient(135deg,#1D4ED8,#7C3AED)",color:gen?"var(--muted)":"#fff",border:"none",borderRadius:12,fontSize:16,fontWeight:800,cursor:gen?"not-allowed":"pointer"}}>{gen?"🧠 Dra. Sofia Mendes analisando...":"🚀 Gerar Relatório de Contratação"}</button>
  </div>);
}

// ======================= LAUDO =======================
function Laudo({report,onBack}){
  const RS={"CONTRATAR":{bg:"#D1FAE5",c:"#065F46",bc:"#6EE7B7"},"CONTRATAR COM RESSALVAS":{bg:"#FEF3C7",c:"#92400E",bc:"#FCD34D"},"NÃO CONTRATAR":{bg:"#FEE2E2",c:"#991B1B",bc:"#FCA5A5"}};
  const rc=RS[report.recomendacao]||{bg:"#F3F4F6",c:"#374151",bc:"#D1D5DB"};
  const RISK={BAIXO:"#065F46","MÉDIO":"#92400E",ALTO:"#991B1B","CRÍTICO":"#7F1D1D"};
  const dl=()=>{ try{
    const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const dim=Object.entries(DIMS).map(([k,v])=>"<tr><td style='padding:6px 10px;border-bottom:1px solid #eee'>"+v.icon+" "+esc(v.name)+" (peso "+v.w+"%)</td><td style='padding:6px 10px;border-bottom:1px solid #eee;text-align:right;font-weight:700;color:"+v.c+"'>"+report.scores.dim[k]+"/"+v.max+"</td></tr>").join("");
    const li=a=>(a||[]).map(x=>"<li style='margin-bottom:6px'>"+esc(x)+"</li>").join("");
    const html="<!DOCTYPE html><html lang='pt-BR'><head><meta charset='utf-8'><title>Laudo "+esc(report.candidateName)+"</title></head><body style='font-family:system-ui,Arial,sans-serif;max-width:760px;margin:0 auto;padding:24px;color:#1e293b'><div style='background:#0F172A;color:#fff;border-radius:14px;padding:22px'><div style='font-size:11px;opacity:.6;letter-spacing:2px'>BIOPROFILE · LAUDO</div><div style='font-size:22px;font-weight:800'>"+esc(report.candidateName)+"</div>"+(report.cpf?"<div style='font-size:12px;opacity:.8'>CPF: "+esc(report.cpf)+"</div>":"")+"<div style='font-size:13px;opacity:.75'>Vendedor · Bio Celulares · "+new Date().toLocaleDateString("pt-BR")+"</div><div style='margin-top:12px'>Score: <b>"+report.scoreGeral+"/100</b> · Recomendação: <b>"+esc(report.recomendacao)+"</b> · Risco de caráter: <b>"+esc(report.riscoCarater)+"</b></div></div><div style='border:2px solid #ddd;border-radius:12px;padding:18px;margin:18px 0;text-align:center'><div style='font-size:24px;font-weight:800'>"+esc(report.recomendacao)+"</div><p>"+esc(report.recomendacaoJustificativa)+"</p>"+(report.condicoes&&report.condicoes!=="N/A"?"<p style='background:#FEF3C7;padding:10px;border-radius:8px'><b>Condições:</b> "+esc(report.condicoes)+"</p>":"")+"</div><h3>Resumo Executivo</h3><p>"+esc(report.resumoExecutivo)+"</p><h3>Perfil Comportamental</h3><p>"+esc(report.perfilComportamental)+"</p>"+(report.analiseFala&&report.analiseFala!=="N/A"?"<h3>Análise da Fala</h3><p>"+esc(report.analiseFala)+"</p>":"")+"<h3>Scores por Dimensão</h3><table style='width:100%;border-collapse:collapse'>"+dim+"</table><h3 style='color:#15803D'>Pontos Fortes</h3><ul>"+li(report.pontosFortes)+"</ul><h3 style='color:#C2410C'>Pontos de Atenção</h3><ul>"+li(report.pontosAtencao)+"</ul>"+(report.impactoProcessos&&report.impactoProcessos!=="N/A"?"<h3>Relação com Empregadores</h3><p>"+esc(report.impactoProcessos)+"</p>":"")+"<h3>Perguntas para 2ª Entrevista</h3><ul>"+li(report.perguntasAprofundamento)+"</ul><p style='margin-top:30px;font-size:11px;color:#999;text-align:center'>BioProfile · Dra. Sofia Mendes · Ctrl+P para salvar como PDF</p></body></html>";
    const blob=new Blob([html],{type:"text/html;charset=utf-8"}); const url=URL.createObjectURL(blob); const a=document.createElement("a");
    a.href=url; a.download="Laudo_"+(report.candidateName||"candidato").replace(/[^a-zA-Z0-9]/g,"_")+".html"; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(url),3000);
  }catch(e){ alert("Erro ao baixar: "+e.message); } };
  const wrap={};
  return (<div>
    <button onClick={onBack} style={{background:"none",border:"none",color:"var(--muted)",fontSize:13,cursor:"pointer",marginBottom:12,padding:0}}>← Voltar</button>
    <div style={{background:"linear-gradient(135deg,#0F172A,#1e3a8a,#4c1d95)",borderRadius:16,padding:"22px 24px",color:"#fff",marginBottom:20}}>
      <div style={{fontSize:11,opacity:.6,letterSpacing:2,textTransform:"uppercase",marginBottom:4}}>BioProfile · Laudo</div>
      <div style={{fontSize:22,fontWeight:900}}>{report.candidateName}</div>
      {report.cpf&&<div style={{fontSize:12,opacity:.7,fontFamily:"monospace"}}>CPF: {formatCPF(report.cpf)}</div>}
      <div style={{display:"flex",gap:10,marginTop:14,flexWrap:"wrap"}}>
        <div style={{background:"rgba(255,255,255,.15)",borderRadius:10,padding:"8px 16px",textAlign:"center"}}><div style={{fontSize:11,opacity:.7}}>Score</div><div style={{fontSize:26,fontWeight:900}}>{report.scoreGeral}/100</div></div>
        <div style={{background:"rgba(255,255,255,.12)",borderRadius:10,padding:"8px 16px",textAlign:"center"}}><div style={{fontSize:10,opacity:.7}}>Risco Caráter</div><div style={{fontSize:13,fontWeight:800,marginTop:2}}>{report.riscoCarater}</div></div>
        {report.litCount&&report.litCount!=="0"&&<div style={{background:"rgba(220,38,38,.25)",borderRadius:10,padding:"8px 16px",textAlign:"center"}}><div style={{fontSize:10,opacity:.7}}>Processos</div><div style={{fontSize:13,fontWeight:800,marginTop:2}}>{report.litCount==="3+"?"+3":report.litCount}</div></div>}
      </div>
    </div>
    <div style={{background:rc.bg,border:"2px solid "+rc.bc,borderRadius:14,padding:20,marginBottom:20,textAlign:"center"}}>
      <div style={{fontSize:11,color:rc.c,fontWeight:700,textTransform:"uppercase",letterSpacing:.5,marginBottom:4}}>Recomendação Final</div>
      <div style={{fontSize:26,fontWeight:900,color:rc.c,marginBottom:10}}>{report.recomendacao}</div>
      <div style={{fontSize:14,color:rc.c,lineHeight:1.7}}>{report.recomendacaoJustificativa}</div>
      {report.condicoes&&report.condicoes!=="N/A"&&<div style={{background:"var(--card)",borderRadius:9,padding:"10px 14px",marginTop:12,fontSize:13,textAlign:"left"}}><b>📌 Condições:</b> {report.condicoes}</div>}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
      <div style={{background:"var(--card)",border:"2px solid var(--line)",borderRadius:12,padding:16,textAlign:"center"}}><div style={{fontSize:10,fontWeight:700,color:"var(--muted)",textTransform:"uppercase"}}>🔐 Risco de Caráter</div><div style={{fontSize:22,fontWeight:900,color:RISK[report.riscoCarater]||"var(--ink)"}}>{report.riscoCarater}</div><div style={{fontSize:11,color:"var(--muted)",marginTop:6,lineHeight:1.5}}>{report.riscoCaraterJustificativa}</div></div>
      <div style={{background:"var(--card)",border:"2px solid var(--line)",borderRadius:12,padding:16,textAlign:"center"}}><div style={{fontSize:10,fontWeight:700,color:"var(--muted)",textTransform:"uppercase"}}>🎯 Potencial de Vendas</div><div style={{fontSize:22,fontWeight:900,color:"#1E3A8A"}}>{report.potencialVendas}</div><div style={{fontSize:11,color:"var(--muted)",marginTop:6,lineHeight:1.5}}>{report.potencialVendasJustificativa}</div></div>
    </div>
    <div style={{background:"var(--card)",border:"2px solid var(--line)",borderRadius:14,padding:18,marginBottom:16}}>
      <div style={{fontSize:12,fontWeight:700,marginBottom:12}}>📊 Scores por Dimensão</div>
      {Object.entries(DIMS).map(([k,v])=>(<div key={k} style={{marginBottom:9}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}><span style={{fontSize:12}}>{v.icon} {v.name} <span style={{fontSize:10,color:"var(--muted)"}}>(peso {v.w}%)</span></span><span style={{fontSize:12,fontWeight:700,color:v.c}}>{report.scores.dim[k]}/{v.max} · {Math.round(report.scores.dim[k]/v.max*100)}%</span></div><Bar value={report.scores.dim[k]} max={v.max} color={v.c} h={6}/></div>))}
    </div>
    <Sec title="📋 Resumo Executivo" c="#475569">{report.resumoExecutivo}</Sec>
    <Sec title="🧠 Perfil Comportamental" c="#1E40AF">{report.perfilComportamental}</Sec>
    {report.analiseFala&&report.analiseFala!=="N/A"&&<Sec title="🎥 Análise da Fala (Persuasão · Consistência · Clareza)" c="#1E40AF">{report.analiseFala}</Sec>}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
      <div style={{background:"rgba(16,185,129,.08)",border:"2px solid #BBF7D0",borderRadius:12,padding:16}}><div style={{fontSize:11,fontWeight:700,color:"#15803D",marginBottom:10,textTransform:"uppercase"}}>✅ Pontos Fortes</div>{(report.pontosFortes||[]).map((p,i)=><div key={i} style={{fontSize:12,color:"#166534",marginBottom:8,paddingLeft:10,borderLeft:"3px solid #4ADE80",lineHeight:1.5}}>{p}</div>)}</div>
      <div style={{background:"rgba(234,88,12,.07)",border:"2px solid #FED7AA",borderRadius:12,padding:16}}><div style={{fontSize:11,fontWeight:700,color:"#C2410C",marginBottom:10,textTransform:"uppercase"}}>⚠️ Pontos de Atenção</div>{(report.pontosAtencao||[]).map((p,i)=><div key={i} style={{fontSize:12,color:"#9A3412",marginBottom:8,paddingLeft:10,borderLeft:"3px solid #FB923C",lineHeight:1.5}}>{p}</div>)}</div>
    </div>
    {report.impactoProcessos&&report.impactoProcessos!=="N/A"&&<Sec title="⚖️ Relação com Empregadores Anteriores" c="#B45309">{report.impactoProcessos}</Sec>}
    {report.scores.flags.length>0&&<div style={{background:"rgba(239,68,68,.06)",border:"2px solid #FECDD3",borderRadius:12,padding:16,marginBottom:16}}><div style={{fontSize:11,fontWeight:700,color:"#BE123C",marginBottom:10,textTransform:"uppercase"}}>🚨 Red Flags do Teste</div>{report.scores.flags.map((f,i)=><div key={i} style={{marginBottom:8,padding:"8px 12px",background:"var(--card)",borderRadius:8,borderLeft:"4px solid "+(f.flag.includes("🚨")?"#DC2626":"#F59E0B")}}><div style={{fontSize:11,fontWeight:700,color:f.flag.includes("🚨")?"#BE123C":"#D97706"}}>{f.flag}</div><div style={{fontSize:11,color:"var(--muted)",marginTop:2}}>{f.n}: "{f.ans}"</div></div>)}</div>}
    {(report.perguntasAprofundamento||[]).length>0&&<div style={{background:"rgba(124,58,237,.06)",border:"2px solid #DDD6FE",borderRadius:12,padding:16,marginBottom:20}}><div style={{fontSize:11,fontWeight:700,color:"#5B21B6",marginBottom:10,textTransform:"uppercase"}}>❓ Perguntas para 2ª Entrevista</div>{report.perguntasAprofundamento.map((p,i)=><div key={i} style={{background:"var(--card)",borderRadius:8,padding:"10px 14px",marginBottom:8,fontSize:13,color:"#3730A3",borderLeft:"3px solid #818CF8",lineHeight:1.5}}>{i+1}. {p}</div>)}</div>}
    <button onClick={dl} style={{width:"100%",padding:14,background:"#1e3a8a",color:"#fff",border:"none",borderRadius:10,fontSize:14,fontWeight:700,cursor:"pointer"}}>⬇️ Baixar laudo (HTML para imprimir / PDF)</button>
    <div style={{fontSize:11,color:"var(--muted)",textAlign:"center",marginTop:8,lineHeight:1.5}}>Abra o arquivo baixado e use Ctrl+P (ou Cmd+P) → "Salvar como PDF".</div>
  </div>);
}
function Sec({title,c,children}){ return (<div style={{background:"var(--card)",border:"2px solid var(--line)",borderRadius:12,padding:16,marginBottom:16}}><div style={{fontSize:11,fontWeight:700,color:c,marginBottom:8,textTransform:"uppercase",letterSpacing:.5}}>{title}</div><div style={{fontSize:14,lineHeight:1.75}}>{children}</div></div>); }

// ======================= APP =======================
function App(){
  const [mode,setMode]=useState(null);
  if(mode==="candidato") return (<div><TopBar label="Candidato" onExit={()=>setMode(null)}/><Candidato/></div>);
  if(mode==="recrutador") return <Recrutador onExit={()=>setMode(null)}/>;
  return (<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
    <div style={{maxWidth:440,width:"100%"}}>
      <div style={{textAlign:"center",marginBottom:28}}><div style={{fontSize:11,color:"var(--muted)",letterSpacing:2,textTransform:"uppercase",marginBottom:6}}>Bio Celulares · RH</div><div style={{fontSize:28,fontWeight:900}}>BioProfile™ Vendedores</div><div style={{fontSize:13,color:"var(--muted)",marginTop:6}}>Dra. Sofia Mendes · Avaliação comportamental</div></div>
      <button onClick={()=>setMode("candidato")} style={{width:"100%",padding:"22px 24px",background:"var(--card)",border:"2px solid var(--line)",borderRadius:16,cursor:"pointer",marginBottom:14,textAlign:"left"}}><div style={{fontSize:18,fontWeight:800,color:"#1D4ED8",marginBottom:4}}>👤 Sou Candidato</div><div style={{fontSize:13,color:"var(--muted)",lineHeight:1.5}}>Responder o teste, as perguntas e enviar meu currículo.</div></button>
      <button onClick={()=>setMode("recrutador")} style={{width:"100%",padding:"22px 24px",background:"linear-gradient(135deg,#0F172A,#1e3a8a)",border:"none",borderRadius:16,cursor:"pointer",textAlign:"left"}}><div style={{fontSize:18,fontWeight:800,color:"#fff",marginBottom:4}}>🔐 Sou Recrutador (RH)</div><div style={{fontSize:13,color:"rgba(255,255,255,.7)",lineHeight:1.5}}>Buscar candidato, adicionar entrevista e gerar o relatório.</div></button>
    </div>
  </div>);
}
function TopBar({label,onExit}){ return (<div style={{background:"var(--card)",borderBottom:"1px solid var(--line)",padding:"10px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:13,fontWeight:800}}>BioProfile · {label}</span><button onClick={onExit} style={{background:"none",border:"none",color:"var(--muted)",fontSize:12,cursor:"pointer"}}>trocar</button></div>); }

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
